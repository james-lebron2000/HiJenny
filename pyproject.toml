[project]
name = "assetdd-ai"
version = "0.1.0"
description = "AssetDD AI — evidence-first pharmaceutical BD due diligence (MVP)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["assetdd"]
