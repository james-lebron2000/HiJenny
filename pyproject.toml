[project]
name = "hijenny"
version = "0.1.0"
description = "HiJenny — evidence-first pharmaceutical BD due diligence (MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HiJenny" }]
keywords = ["pharma", "due-diligence", "clinical-trials", "evidence", "license-in", "llm"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "SQLAlchemy>=2.0",
    "PyMuPDF>=1.23",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "PyYAML>=6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
hijenny = "hijenny.cli:main"

[tool.setuptools.packages.find]
include = ["hijenny*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
