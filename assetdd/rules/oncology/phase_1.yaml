schema_version: rule-pack-1.0
pack:
  pack_id: oncology-phase-1
  name: Oncology Phase 1 due-diligence checklist (stub)
  version: "1.0.0"
  therapeutic_area: oncology
  phase: [1]
  modality: []
  description: >
    Phase 1 evidence expectations: dose-escalation design, dose-limiting
    toxicity and early response signal. Deliberately compact; a Phase 1 package
    prioritises safety and exposure over confirmatory efficacy claims.
rules:
  - rule_id: onco1.study.design
    name: Dose-escalation study design
    version: "1.0"
    applies_to: {}
    dimension: study_design
    required_evidence:
      - id: design_statement
        label: Dose-escalation design and dose levels
        fields: [design]
        min_documents: 1
        min_records: 1
    question_template: >-
      Please provide the dose-escalation design and dose-level summary for
      {requirement}, including the MTD/RP2D determination method. Requested
      documents: {documents}.
    priority: high
    owner: Clinical Development
    required_documents: [PROTOCOL, CSR]
    notes: Phase 1 designs are frequently 3+3 or mTPI/BOIN; the method matters for RP2D interpretation.

  - rule_id: onco1.safety.grade3
    name: Grade >=3 adverse events including dose-limiting toxicity
    version: "1.0"
    applies_to: {}
    dimension: safety
    required_evidence:
      - id: grade3_ae
        label: Grade >=3 adverse events / dose-limiting toxicities by dose level
        fields: [grade3_ae]
        min_documents: 1
        min_records: 1
    question_template: >-
      Please provide the grade >=3 adverse event and dose-limiting toxicity
      table supporting {requirement}, by dose level and with the safety
      population denominator. Requested documents: {documents}.
    priority: high
    owner: Safety / Pharmacovigilance
    required_documents: [CSR, SAFETY]
    notes: DLT definition and attribution period determine the safety interpretation.

  - rule_id: onco1.safety.sae
    name: Serious adverse events in the dose-escalation portion
    version: "1.0"
    applies_to: {}
    dimension: safety
    required_evidence:
      - id: sae_value
        label: Serious adverse event rate for treated patients
        fields: [sae]
        min_documents: 1
        min_records: 1
    question_template: >-
      Please provide the serious adverse event summary supporting
      {requirement}, with the safety population denominator and data cut-off.
      Requested documents: {documents}.
    priority: high
    owner: Safety / Pharmacovigilance
    required_documents: [CSR, SAFETY]
    notes: Even small Phase 1 safety populations require explicit denominators.

  - rule_id: onco1.efficacy.orr
    name: Early response signal (ORR)
    version: "1.0"
    applies_to: {}
    dimension: efficacy
    required_evidence:
      - id: orr_value
        label: Response rate in the escalation cohorts, with population and response criteria
        fields: [orr]
        min_documents: 1
        min_records: 1
    question_template: >-
      Please provide the response data supporting {requirement}, including the
      evaluable population and response criteria. Requested documents:
      {documents}.
    priority: medium
    owner: Clinical Development
    required_documents: [CSR, IB]
    notes: Phase 1 response rates are exploratory; population and criteria are essential context.
