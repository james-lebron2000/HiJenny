<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HiJenny — Due Diligence Review</title>
  <meta name="description" content="Evidence-first pharma BD due-diligence review workspace: documents, evidence, findings, seller questions and reports." />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AD</div>
        <div class="brand-text">
          <strong>HiJenny</strong>
          <span>Due Diligence</span>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <div class="nav-label">Workspace</div>
        <button class="nav-item" data-nav="projects" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
          <span>Projects</span><span class="badge" id="badge-projects">0</span>
        </button>
        <button class="nav-item" data-nav="upload" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span>Upload &amp; Analysis</span><span class="badge" id="badge-docs">0</span>
        </button>
        <button class="nav-item" data-nav="evidence" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4H6a2 2 0 0 0-2 2v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V6a2 2 0 0 0-2-2h-3"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M8 11h8M8 15h6"/></svg>
          <span>Evidence</span><span class="badge" id="badge-evidence">0</span>
        </button>
        <button class="nav-item" data-nav="findings" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2.8 20h18.4L12 3z"/><path d="M12 9v5M12 17.5v.5"/></svg>
          <span>Findings &amp; Questions</span><span class="badge" id="badge-findings">0</span>
        </button>
        <button class="nav-item" data-nav="report" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
          <span>Report</span><span class="badge" id="badge-report">—</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div><span class="dot" id="api-dot"></span><span id="api-status">API: connecting…</span></div>
        <div><span class="dot" id="llm-dot"></span><span id="llm-status">Extraction: …</span></div>
        <div class="mono" style="font-size:10px;color:#6f86a8">HiJenny v0.1 · MVP</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <div class="topbar-title" id="topbar-title">Projects</div>
          <div class="topbar-sub" id="topbar-sub">Select a project to begin</div>
        </div>
        <div class="topbar-spacer"></div>
        <div class="project-select">
          <label for="project-select">Project</label>
          <select id="project-select"></select>
        </div>
        <span id="project-status"></span>
        <button class="btn primary sm" id="btn-analyze-topbar" type="button">Run analysis</button>
      </header>

      <main class="view" id="view">
        <div class="loading-block"><div class="spinner"></div>Loading workspace…</div>
      </main>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
