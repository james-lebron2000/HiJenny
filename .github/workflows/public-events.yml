name: Public asset events
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-asset-event-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read public sources
        id: fetch
        continue-on-error: true
        run: python3 tools/collect_public_events.py
      - name: Publish changed monthly files
        run: |
          git add -- data/public/events
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public asset event index"
          git push origin HEAD:main
      - name: Report incomplete source checks
        if: steps.fetch.outcome == 'failure'
        run: exit 1
