name: Public asset events
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-asset-event-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read public sources
        id: fetch
        continue-on-error: true
        run: |
          export HIJENNY_COLLECTION_COMMIT
          HIJENNY_COLLECTION_COMMIT=$(git rev-parse --verify HEAD)
          python3 tools/collect_public_events.py --receipt "$RUNNER_TEMP/collection.json"
      - name: Publish monthly files and latest receipt
        run: |
          receipt="$RUNNER_TEMP/collection.json"
          month=$(jq -er --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg commit "$(git rev-parse HEAD)" '
            select(.run_id == $run and .run_attempt == $attempt and .collector_commit == $commit and (.checks | type == "array") and
                   (.new_events == ([.checks[].new_events // 0] | add // 0)))
            | .started_utc | capture("^(?<month>[0-9]{4}-[0-9]{2})-").month
          ' "$receipt")
          ledger="data/public/events/$month.jsonl"
          if test -f "$ledger"; then git add -- "$ledger"; fi
          read -r added removed _ < <(git diff --cached --numstat -- "$ledger") || true
          test "${added:-0}" = "$(jq -r .new_events "$receipt")"
          test "${removed:-0}" = 0
          cp "$receipt" data/public/events/collection.json
          git add -- data/public/events/collection.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public asset event index"
          base=$(git rev-parse HEAD^)
          batch=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --no-tags origin main
            tip=$(git rev-parse FETCH_HEAD)
            if git merge-base --is-ancestor HEAD "$tip"; then exit 0; fi
            git merge-base --is-ancestor "$base" "$tip"
            if ! git diff --quiet "$base" "$tip" -- data/public tools hijenny/publication.py .github/workflows/public-events.yml; then
              echo "The public collection inputs or archive changed. Run a fresh collection from main." >&2
              exit 1
            fi
            if test "$attempt" -lt 3; then
              git switch --detach "$tip"
              git cherry-pick "$batch"
            fi
          done
          exit 1
      - name: Attach collection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-collection-receipt
          path: ${{ runner.temp }}/collection.json
          if-no-files-found: error
      - name: Summarize source checks
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "collection.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print("## 公开来源核对记录", file=out)
              print(f"核对结束（UTC） {receipt['finished_utc']} · 新增事件 {receipt['new_events']}", file=out)
              commit = receipt["collector_commit"]
              print(f"采集代码 [{commit[:12]}](https://github.com/{os.environ['GITHUB_REPOSITORY']}/tree/{commit}) · 第 {receipt['run_attempt']} 次运行", file=out)
              print("\n| 来源 | 目标编号 | 核对结果 | 来源记录数 | 新增事件 |", file=out)
              print("|---|---|---|---:|---:|", file=out)
              for row in receipt["checks"]:
                  status = {"ok": "成功", "manual_review": "待人工复核"}.get(row["status"], "失败 " + row.get("error", ""))
                  counts = [row[k] if row[k] is not None else "待核" for k in ("records", "new_events")]
                  print(f"| {row['source']} | {row['target']} | {status} | {counts[0]} | {counts[1]} |", file=out)
      - name: Report incomplete source checks
        if: steps.fetch.outcome == 'failure'
        run: exit 1
